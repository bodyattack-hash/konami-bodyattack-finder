 shown=base.filter(r=>(!$('pref').value||r.pref===$('pref').value)&&(!$('store').value||r.name===$('store').value)&&(!regular||!$('day').value||r.day===$('day').value)&&(!$('duration').value||r.duration===+$('duration').value)&&(!$('query').value||norm(r.name+r.instructor).includes(norm($('query').value)))&&(!$('time').value||($('time').value==='morning'?r.start<'12:00':$('time').value==='afternoon'?r.start>='12:00'&&r.start<'18:00':r.start>='18:00')));
 shown.sort((a,b)=>$('sort').value==='store'?a.name.localeCompare(b.name,'ja')||a.dayIndex-b.dayIndex||a.start.localeCompare(b.start):$('sort').value==='time'?a.start.localeCompare(b.start)||a.dayIndex-b.dayIndex:a.dayIndex-b.dayIndex||a.start.localeCompare(b.start));
 $('count').textContent=shown.length+'件ヒット';
 $('scope').textContent=regular?'全国版ではなく3店舗の検証版です。通常表のアタック7枠（60分5・45分1・30分1）を収録。初期表示は60分。11月の週ごとの例外・代行告知は別途確認が必要です。':mode==='20261103'?'11/3は自由が丘駅前の45分1枠を収録。府中・守口は公式画面の休館表示を確認しています。初期表示は60分のため、45分を見るにはレッスン時間を変更してください。':'11/23は3店舗とも、取得した祝日時間割に対象日の掲載がありません。開催なしと判定していません。';
 $('results').innerHTML=shown.length?shown.map(r=>`<article class="card"><div class="top"><h2>${escape(r.name)}</h2><span class="badge">${regular?escape(r.day)+'曜日':escape(r.date.slice(4,6)+'/'+r.date.slice(6,8))+'（'+escape(r.day)+'・祝）'}</span></div><div class="time">${escape(r.start)}–${escape(r.end)}</div><div>IR：${escape(r.instructor)}</div><div class="meta">${escape(r.pref)} ／ ${escape(r.studio)} ／ ${r.duration}分</div><div class="fee">${r.paidMark?'有料プログラムの表示あり（料金詳細は公式で確認）':'時間割に有料プログラムの表示なし'}<br>有料優先予約・施設利用料は別途ご確認ください。</div><a href="${escape(r.source)}" target="_blank" rel="noopener noreferrer">公式${regular?'通常':'祝日'}時間割を確認 ↗</a></article>`).join(''):`<div class="empty">${!regular&&mode==='20261123'?'対象日の時間割は未掲載です。':base.length?'条件に一致するレッスンがありません。<br>レッスン時間などの条件を変更してください。':'収録対象のレッスンはありません。'}<br>全国の検索結果ではありません。</div>`;
 $('audits').innerHTML=DATA.stores.map(s=>{let aa=DATA.audits.filter(a=>a.store===s.name&&(regular?a.mode==='regular':a.mode==='holiday'&&a.date===mode));let n=aa.reduce((v,a)=>v+(a.attack||0),0),status=regular?'全7曜日確認・'+n+'枠':aa.some(a=>a.status==='対象日未掲載')?'対象日未掲載':aa.some(a=>a.status==='公式休館表示')?'公式休館表示':'掲載確認・'+n+'枠';return `<tr><td>${escape(s.name)}</td><td>${status}</td><td><a href="${escape(aa[0].source)}" target="_blank" rel="noopener noreferrer">公式表 ↗</a></td></tr>`}).join('');
}
function reset(){ $('filters').reset();$('message').textContent='';render() }
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));reset()}));
$('filters').addEventListener('input',render);$('filters').addEventListener('change',render);$('filters').addEventListener('submit',e=>e.preventDefault());$('reset').addEventListener('click',reset);
$('copy').addEventListener('click',async()=>{let text=`コナミBODYATTACK・3店舗検証版 ${mode==='regular'?'通常11月':mode} ${shown.length}件\n`+shown.map(r=>`${r.name} ${r.day} ${r.start}–${r.end} ${r.duration}分 ${r.instructor}`).join('\n');try{await navigator.clipboard.writeText(text);$('message').textContent='結果をコピーしました'}catch{$('message').textContent='この環境ではコピーできません。ブラウザで開いてお試しください'}});render();
</script></html>
