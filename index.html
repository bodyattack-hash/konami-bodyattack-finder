 shown=base.filter(r=>regionMatch(r)&&(!$('store').value||r.name===$('store').value)&&(!regular||!$('day').value||r.day===$('day').value)&&(!$('duration').value||r.duration===+$('duration').value)&&(!$('query').value||norm(r.name+r.instructor+(r.aliases||[]).join('')).includes(norm($('query').value)))&&(!$('time').value||($('time').value==='morning'?r.start<'12:00':$('time').value==='afternoon'?r.start>='12:00'&&r.start<'18:00':r.start>='18:00')));
 shown.sort((a,b)=>$('sort').value==='store'?a.name.localeCompare(b.name,'ja')||a.dayIndex-b.dayIndex||a.start.localeCompare(b.start):$('sort').value==='time'?a.start.localeCompare(b.start)||a.dayIndex-b.dayIndex:a.dayIndex-b.dayIndex||a.start.localeCompare(b.start));
 $('count').textContent=shown.length+'件ヒット';
 $('scope').textContent=DATA.notes[mode];
 $('results').innerHTML=shown.length?shown.map(r=>`<article class="card"><div class="top"><h2>${escape(r.name)}</h2><span class="badge">${regular?escape(r.day)+'曜日':escape(r.date.slice(4,6)+'/'+r.date.slice(6,8))+'（'+escape(r.day)+'・祝）'}</span></div><div class="time">${escape(r.start)}–${escape(r.end)}</div><div>IR：${escape(r.instructor)}</div><div class="meta">${escape(r.pref)} ／ ${escape(r.studio)} ／ ${r.duration}分${/オンライン/.test(r.program)?' ／ オンライン':''}${/少人数/.test(r.program)?' ／ 少人数制':''}</div><div class="meta">公式表記：${escape(r.program)}</div><div class="note" style="margin:10px 0" ${r.scheduleNote?'':'hidden'}>${escape(r.scheduleNote||'')}</div><div class="fee">${r.paidMark?'有料プログラムの表示あり（料金詳細は公式で確認）':r.schoolMark?'スクールの表示あり（料金詳細は公式で確認）':'時間割に有料プログラムの表示なし'}<br>有料優先予約・施設利用料は別途ご確認ください。</div><a href="${escape(r.source)}" target="_blank" rel="noopener noreferrer">公式${regular?'通常':'祝日'}時間割を確認 ↗</a></article>`).join(''):`<div class="empty">${!regular&&mode==='20261123'?'対象日の時間割は未掲載です。':base.length?'条件に一致するレッスンがありません。<br>レッスン時間などの条件を変更してください。':'収録対象のレッスンはありません。'}<br>店舗別の確認状況もご確認ください。</div>`;
 $('audits').innerHTML=DATA.stores.filter(regionMatch).map(s=>{let aa=DATA.audits.filter(a=>a.store===s.name&&(regular?a.mode==='regular':a.mode==='holiday'&&a.date===mode));let n=aa.reduce((v,a)=>v+(a.attack||0),0),status=aa.some(a=>a.error)?'取得・確認保留':regular?'全7曜日確認・'+n+'枠':aa.some(a=>a.status==='対象日未掲載')?'対象日未掲載':aa.some(a=>a.status==='公式休館表示')?'公式休館表示':aa.some(a=>a.status==='データなし・要確認')?'データなし・要確認':'掲載確認・'+n+'枠';return `<tr><td>${escape(s.name)}</td><td>${escape(status)}</td><td><a href="${escape(aa[0]?.source||s.homepage)}" target="_blank" rel="noopener noreferrer">公式表 ↗</a></td></tr>`}).join('');
}
function reset(){ $('filters').reset();for(const o of $('store').options)o.hidden=false;$('message').textContent='';render() }
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));reset()}));
$('filters').addEventListener('input',render);$('filters').addEventListener('change',render);$('filters').addEventListener('submit',e=>e.preventDefault());$('reset').addEventListener('click',reset);
$('copy').addEventListener('click',async()=>{let text=`コナミBODYATTACK・全国版 ${mode==='regular'?'通常11月':mode} ${shown.length}件\n`+shown.map(r=>`${r.name} ${r.day} ${r.start}–${r.end} ${r.duration}分 ${r.instructor}`).join('\n');try{await navigator.clipboard.writeText(text);$('message').textContent='結果をコピーしました'}catch{$('message').textContent='この環境ではコピーできません。ブラウザで開いてお試しください'}});render();
</script></html>
